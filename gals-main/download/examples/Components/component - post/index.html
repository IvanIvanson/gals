<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post & Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 600px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .search-box {
      margin-top: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .post {
      background: #f9f9f9;
      border-left: 4px solid #007acc;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Post & Search System</h2>

  <!-- Post input -->
  <textarea id="postInput" placeholder="Write a post..."></textarea>
  <button onclick="addPost()">Post</button>

  <!-- Search input -->
  <div class="search-box">
    <input type="text" id="searchInput" onkeyup="searchPosts()" placeholder="Search posts...">
  </div>

  <!-- Posts list -->
  <div id="postList"></div>
</div>

<script>
  function addPost() {
    const input = document.getElementById('postInput');
    const text = input.value.trim();
    if (text === "") return;

    const postList = document.getElementById('postList');
    const post = document.createElement('div');
    post.className = 'post';
    post.textContent = text;
    postList.prepend(post);
    input.value = "";
  }

  function searchPosts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const posts = document.querySelectorAll('.post');
    posts.forEach(post => {
      const content = post.textContent.toLowerCase();
      post.style.display = content.includes(query) ? 'block' : 'none';
    });
  }
  
</script>

</body>
</html>
