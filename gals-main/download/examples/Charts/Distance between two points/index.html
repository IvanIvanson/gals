<!DOCTYPE html>
<html>
    <head>
        <title>Page Title</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous"></script>
  <script src="http://fred-wang.github.io/mathjax.js/mpadded-min.js"></script>        
    </head>
    <body>
        
        
        <div class="inputBlock">
        <div class="inputBlockLeft">
        <span>x<sub>1</sub>=</span>  <input type="number" id="inpX1" class="inp" placeholder="x1"><br>
        <span>y<sub>1</sub>=</span>  <input type="number" id="inpY1" class="inp" placeholder="y1"><br>
        
        <span>x<sub>2</sub>=</span> <input type="number" id="inpX2" class="inp" placeholder="x2"> <br>
        
       <span>y<sub>2</sub>=</span> <input type="number" id="inpY2" class="inp" placeholder="y2">
        </div>
        
        <div class="inputBlockRight">
     
          <!-- --> 
          
     
 <p class="formulText">Distance between two points:<svg  xmlns="http://www.w3.org/2000/svg" class="sqrt">
   <path d="M15 20 L20 30 25 10 130 10" stroke="black" fill="none"/>
     </svg>
       <span class="dist">D = </span> <span class="formula">(x<sub>2</sub>-x<sub>1</sub>)<sup>2</sup>+<span>(y<sub>2</sub>-y<sub>1</sub>)<sup>2</sup></span><span id="out"></span>
     </p>
          
          
      
          
           <!-- -->
       
        
        </div>
        
        
         </div>
         <div class="resultBlock">
         <button id="btn">Result</button>
         
         </div>
         
      <div class ="resultChart">
      
      <canvas width="200" height="200"></canvas>
       <svg  xmlns="http://www.w3.org/2000/svg" id="svg"> <line x1="0" y1="0" x2="0" y2="0" id="line"  stroke="black" /> 
       
       <!--CirclePoints -->
       
       <circle id="circle1"   cx="0" cy="0" r="2" fill="red"/>   
        
        <circle id="circle2"   r="2" fill="red"/>   
        
       <text  id="textX1" x="0" y="0" class="small"></text>
       <text id="textX2" x="0" y="0" class="small"></text>
       
       <!--End circlePoints -->

       <text id="textD" x="0" y="0" transform="rotate(0)" class="smallD"></text>
        </svg>  
         </div>
         
         <script>
             let cnv = document.querySelector("canvas");
         var ctx = cnv.getContext('2d');    
            
             const WIDTH = 200;
    const HEIGHT = 200;
    
    const DPI_WIDTH = WIDTH*2;
    const DPI_HEIGHT = HEIGHT*2;
    cnv.style.width = WIDTH + 'px';
    cnv.style.height = HEIGHT + 'px';
    cnv.width = DPI_WIDTH;
    cnv.height = DPI_HEIGHT;        
         ctx.beginPath();
         
          for (let y = 0; y < DPI_HEIGHT; y += 50)
           {
           ctx.moveTo(0, y); 
           ctx.lineTo(DPI_HEIGHT, y);
          
           ctx.lineWidth = .5;
           
           ctx.fillText(DPI_HEIGHT/2-y/2, 0, y);
           ctx.font = "18px serif";
           } 
           for (let x = 0; x < DPI_WIDTH; x += 50)
           {
           
           ctx.moveTo(x, 0); 
           ctx.lineTo(x, DPI_WIDTH);
           ctx.fillText(x/2, x, DPI_WIDTH);
           ctx.font = "18px serif";
           } 
           ctx.lineWidth = .5;
           ctx.strokeStyle = "blue";
           ctx.stroke();
           
           
         </script>
         
         
         
    </body>
</html>
