<!DOCTYPE html>
<html>
<head>
    <title>UI Design</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 350px;
            height: 400px;
            margin: 0 auto;
            display: inline-block;
            background: -moz-radial-gradient(center, ellipse cover, #474553 0%, #292830 100%);
            background: -webkit-radial-gradient(center, ellipse cover, #474553 0%, #292830 100%);
            background: radial-gradient(ellipse at center, #474553 0%, #292830 100%);
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#474553', endColorstr='#292830', GradientType=1);
            position: relative;
        }
        div.control-1 {
            position: relative;
            width: 250px;
            height: 250px;
            top: 0;
            border: 7px solid #19191b;
            border-radius: 100%;
            border-bottom: 5px solid transparent;
            box-shadow: 0 -1px 2px -1px rgba(255, 255, 255, .2),
                        inset 0 1px 2px -1px rgba(255, 255, 255, .2);
        }
        .control-button {
            position: absolute;
            width: 27px;
            height: 27px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 100%;
            color: #05d4f4;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #05d4f4;
            cursor: pointer;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 1);
            z-index: 10; /* Убедиться, что кнопки поверх других элементов */
        }
        .control-button.minus {
            content: '-';
            left: 37.5px;
            bottom: 8.5px;
        }
        .control-button.plus {
            content: '+';
            right: 37.5px;
            bottom: 8.5px;
        }
        div.volume-control {
            position: relative;
            width: 220px;
            height: 220px;
            background: #05d4f4;
            border-radius: 100%;
            text-align: center;
            margin-left: 16px;
            margin-top: 15px;
            box-shadow: inset 0 2px 3px 3px rgba(0, 0, 0, .9),
                        0 0 20px rgba(5, 212, 244, .5);
        }
        div.volume-control .panel {
            position: absolute;
            content: '';
            width: 90%;
            height: 90%;
            display: inline-block;
            top: 0;
            left: 0;
            background: #3e3c49;
            border-radius: 100%;
            margin-top: 5%;
            margin-left: 5%;
            overflow: hidden;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, .3),
                        inset -15px -15px 20px 5px rgba(0, 0, 0, .2),
                        inset 15px 15px 10px 5px rgba(0, 0, 0, .15),
                        inset 0 0 2px 4px rgba(0, 0, 0, .9),
                        inset 0 0.5px 2px 5px rgba(255, 255, 255, .9);
        }
        div.volume-control .knob {
            position: absolute;
            top: 0;
            left: 0;
            content: '';
            width: 55%;
            height: 55%;
            display: inline-block;
            background: #42404d;
            border-radius: 100%;
            margin-top: 22.5%;
            margin-left: 22.5%;
            overflow: hidden;
            box-shadow: inset 0 5px 2px -2px rgba(255, 255, 255, 0.3),
                        inset 0 -5px 2px -2px rgba(255, 255, 255, 0.03),
                        0 -5px 5px -2px rgba(0, 0, 0, 0.3),
                        0 30px 10px -2px rgba(0, 0, 0, 0.4),
                        0 50px 55px 10px rgba(0, 0, 0, 0.7),
                        inset 0 0 200px rgba(0, 0, 0, 0.55),
                        inset 0 15px 15px 0 rgba(0, 0, 0, 0.15),
                        inset 0 -35px 25px 0 rgba(255, 255, 255, 0.05),
                        0 -7px 15px -2px rgba(255, 255, 255, 0.05);
        }
        .knob img {
            opacity: 0.1;
        }

        /* Добавляем SVG для шарика */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="control-1">
            <span class="vol-level"></span>
            <button class="control-button minus">-</button>
            <button class="control-button plus">+</button>
            <div class="volume-control">
                <span class="panel"></span>
                <span class="knob"></span>
            </div>
            <svg id="circleSvg" width="250" height="250" xmlns="http://www.w3.org/2000/svg">
                <circle cx="125" cy="125" r="50" fill="none" stroke="none" stroke-width="2" />
                <circle id="dot" cx="170" cy="125" r="9.5" />
            </svg>
        </div>
        <div id="info">
            Угол: <span id="angleDisplay">0</span>°
        </div>
    </div>

    <script>
        const circle = document.querySelector('#circleSvg circle');
        const dot = document.getElementById('dot');
        const angleDisplay = document.getElementById('angleDisplay');

        const circleCenterX = 125; // Центральный X круга
        const circleCenterY = 125; // Центральный Y круга
        const radius = 50; // Радиус основного круга
        let currentAngle = 0;

        // Функция для вычисления угла между точками
        function calculateAngle(x, y) {
            const dx = x - circleCenterX+90;
            const dy = y - circleCenterY+90;
            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
            return angle < 0 ? angle + 360 : angle; // Преобразование в диапазон [0, 360]
        }

        // Функция для позиционирования шарика на окружности
        function positionDot(angle) {
            const radian = (angle * Math.PI) / 180;
            const newX = circleCenterX + radius * Math.cos(radian);
            const newY = circleCenterY + radius * Math.sin(radian);
            dot.setAttribute('cx', newX);
            dot.setAttribute('cy', newY);
            angleDisplay.textContent = Math.round(angle); // Обновление отображаемого угла
            currentAngle = angle;
        }

        // Обработчик нажатия на шарик
        dot.addEventListener('touchstart', (event) => {
            event.preventDefault();
            isDragging = true;
        });

        // Обработчик перемещения по экрану
        document.addEventListener('touchmove', (event) => {
            if (!isDragging) return;

            const touch = event.touches[0];
            const x = touch.clientX - circle.getBoundingClientRect().left;
            const y = touch.clientY - circle.getBoundingClientRect().top;

            const angle = calculateAngle(x, y);
            positionDot(angle);
        });

        // Обработчик окончания перетаскивания
        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Обработка кнопок "+" и "-"
        document.querySelector('.control-button.minus').addEventListener('click', () => {
            console.log('Minus button clicked'); // Отладочная информация
            currentAngle = Math.max(0, currentAngle - 5); // Уменьшаем угол на 5 градусов
            positionDot(currentAngle);
        });

        document.querySelector('.control-button.plus').addEventListener('click', () => {
            console.log('Plus button clicked'); // Отладочная информация
            currentAngle = Math.min(360, currentAngle + 5); // Увеличиваем угол на 5 градусов
            positionDot(currentAngle);
        });

        // Обработка клавиш громкости
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp') {
                currentAngle = Math.min(360, currentAngle + 5); // Увеличиваем угол на 5 градусов
                positionDot(currentAngle);
            } else if (event.key === 'ArrowDown') {
                currentAngle = Math.max(0, currentAngle - 5); // Уменьшаем угол на 5 градусов
                positionDot(currentAngle);
            }
        });
    </script>
</body>
</html>
