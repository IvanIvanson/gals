<!DOCTYPE html>
<html>
    <head>
        <title>Checkbox UI Design</title>
    </head>
    <body>
        <label>
            <input type="checkbox" name="">
            <span class="check"></span>
            <span class="btn"></span>
        </label>
        
        <label>
            <input type="checkbox" name="" checked="checked">
            <span class="check"></span>
            <span class="btn"><p></p></span>
        </label>
    </body>
</html>
