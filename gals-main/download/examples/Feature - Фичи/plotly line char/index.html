<!DOCTYPE html>
<html>
    <head>
        <title>Page Title</title>
    
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; }
        #myPlot { width: 100%; height: 400px; }
    </style>
</head>
<body>
    <div id="myPlot"></div>     
        
        
    <script>
const trace = {
    type: 'scatter3d',
    mode: 'lines',
    x: [1, 2, 3, 4, 5],
    y: [2, 3, 4, 5, 6],
    z: [1, 4, 9, 1, 25],
    line: {
        width: 6,
        color: [1, 2, 3, 4, 5], // Градиент цвета
        colorscale: 'Jet'
    }
};

Plotly.newPlot('myPlot', [trace]);
</script>    
    </body>
</html>
