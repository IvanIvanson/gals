<!DOCTYPE html>
<html>
    <head>
        <title>Interactive Multi-Graph with Legend Below</title>
        <style>
            body { text-align: center; margin: 0; }
            canvas { border: 1px solid #ccc; margin-top: 30px; }
            #btn { margin-top: 20px; }
            #tooltip {
                position: absolute;
                background: #fff;
                border: 1px solid #000;
                padding: 5px;
                display: none;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <h2>Interactive Multi-Graph with Legend Below</h2>
        <canvas id="lineGraf" width="340" height="340"></canvas>
        <input type="text" id="inp" size="2">
        <button id="btn">Add Point</button>
        <div id="tooltip"></div>

        <script>
            class Graph {
                constructor(data = [], color = "blue", label = "Graph") {
                    this.data = data;
                    this.color = color;
                    this.label = label;
                    this.spacing = 10;
                    this.yBase = 250;
                    this.pointRadius = 3;
                    this.lineWidth = 2;
                }

                draw(ctx) {
                    // Отрисовка графика
                    ctx.beginPath();
                    ctx.moveTo(20, this.yBase - this.data[0]);
                    this.data.forEach((val, i) => {
                        ctx.lineTo(20 + i * this.spacing, this.yBase - val);
                    });
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.lineWidth;
                    ctx.stroke();

                    // Отрисовка точек
                    ctx.fillStyle = "red";
                    this.data.forEach((val, i) => {
                        ctx.beginPath();
                        ctx.arc(20 + i * this.spacing, this.yBase - val, this.pointRadius, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                addPoint(value) {
                    this.data.push(value);
                }

                animateNewPoint(newValue, ctx, callback) {
                    const duration = 400;
                    const start = performance.now();
                    const newIndex = this.data.length;
                    
                    const prevY = this.data.length > 0 
                        ? this.yBase - this.data[this.data.length - 1] 
                        : this.yBase;
                    
                    const targetY = this.yBase - newValue;

                    const animateFrame = (now) => {
                        const timePassed = now - start;
                        const progress = Math.min(timePassed / duration, 1);
                        const currentY = prevY + (targetY - prevY) * progress;

                        // Очищаем холст и перерисовываем всё
                        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                        callback(); // Перерисовываем сетку и все графики

                        // Временная линия к анимируемой точке
                        if (this.data.length > 0) {
                            ctx.beginPath();
                            ctx.moveTo(20 + (newIndex - 1) * this.spacing, this.yBase - this.data[newIndex - 1]);
                            ctx.lineTo(20 + newIndex * this.spacing, currentY);
                            ctx.strokeStyle = this.color;
                            ctx.lineWidth = this.lineWidth;
                            ctx.stroke();
                        }

                        // Временная точка
                        ctx.fillStyle = "red";
                        ctx.beginPath();
                        ctx.arc(20 + newIndex * this.spacing, currentY, this.pointRadius, 0, Math.PI * 2);
                        ctx.fill();

                        if (progress < 1) {
                            requestAnimationFrame(animateFrame);
                        } else {
                            this.data.push(newValue);
                            callback(); // Финализация
                        }
                    };

                    requestAnimationFrame(animateFrame);
                }
            }

            class GraphManager {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext("2d");
                    this.graphs = [];
                    this.tooltip = document.getElementById("tooltip");
                }

                addGraph(graph) {
                    this.graphs.push(graph);
                    this.redraw();
                }

                redraw() {
   this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);    
   this.drawTitle();       
                    this.drawGrid();
                    this.graphs.forEach(graph => graph.draw(this.ctx));
                    this.drawLegend();
                }
                
                
   drawTitle() {
                    this.ctx.save(); // Сохраняем текущие настройки контекста
                    this.ctx.font = "bold 16px Arial";
                    this.ctx.fillStyle = "#000";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("Мой график", this.canvas.width / 2, 30);
                    this.ctx.restore(); // Восстанавливаем настройки
                }              

                drawGrid() {
                    // Отрисовка осей
                    this.ctx.beginPath();
                    this.ctx.strokeStyle = "#000";
                    this.ctx.lineWidth = 2;
                    this.ctx.moveTo(20, 10);
                    this.ctx.lineTo(20, 250);
                    this.ctx.lineTo(310, 250);
                    this.ctx.stroke();

                    // Отрисовка горизонтальных линий и текста
                    this.ctx.font = "10px Arial";
                    this.ctx.fillStyle = "#000";
                    for (let i = 0; i <= 200; i += 25) {
                        this.ctx.fillText(i, 2, 250 - i + 3);
                        this.ctx.beginPath();
                        this.ctx.moveTo(20, 250 - i);
                        this.ctx.lineTo(310, 250 - i);
                        
  this.ctx.strokeStyle = i === 0 ? "#000" : "#ddd";                      this.ctx.stroke();
                    }
                }

                drawLegend() {
                    const legendX = 20; // Позиция легенды по X (слева)
                    const legendY = 280; // Позиция легенды по Y (под графиком)
                    const lineLength = 40; // Длина отрезка в легенде
                    const legendSpacing = 25; // Расстояние между элементами легенды

                    this.ctx.font = "12px Arial";
                    this.ctx.textBaseline = "middle"; // Выравнивание текста по центру

                    this.graphs.forEach((graph, index) => {
                        // Рисуем отрезок линии
                        this.ctx.beginPath();
                        this.ctx.strokeStyle = graph.color;
                        this.ctx.lineWidth = graph.lineWidth;
                        this.ctx.moveTo(legendX, legendY + index * legendSpacing);
                        this.ctx.lineTo(legendX + lineLength, legendY + index * legendSpacing);
                        this.ctx.stroke();

                        // Добавляем текст
                        this.ctx.fillStyle = "#000";
                        this.ctx.fillText(
                            graph.label,
                            legendX + lineLength + 10, // Отступ от линии
                            legendY + index * legendSpacing
                        );
                    });
                }

                handleClick(event) {
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = event.clientX - rect.left;
                    const mouseY = event.clientY - rect.top;

                    this.graphs.forEach(graph => {
                        graph.data.forEach((val, i) => {
                            const pointX = 20 + i * graph.spacing;
                            const pointY = graph.yBase - val;
                            const distance = Math.sqrt((mouseX - pointX) ** 2 + (mouseY - pointY) ** 2);

                            if (distance <= 5) {
                                this.tooltip.style.display = "block";
                                this.tooltip.textContent = `Value: ${val}`;
                                this.tooltip.style.left = `${event.clientX + 10}px`;
                                this.tooltip.style.top = `${event.clientY - 10}px`;
                            }
                        });
                    });
                }
            }

            // Инициализация
            const canvas = document.getElementById("lineGraf");
            const btn = document.getElementById("btn");
            const inp = document.getElementById("inp");

            const graphManager = new GraphManager(canvas);
//-------
const data = [10, 80, 100, 140, 150, 160, 170, 180, 100, 40, 72, 109, 160, 90];
//-------- 
            const graph1 = new Graph([150, 150, 70, 40, 20, 10, 5, 2.5, 1.25], "skyblue", "График_1");
            const graph2 = new Graph([100, 80, 60, 40, 30, 20, 10, 5, 2.5], "lightgreen", "График_2");
             const graph3 = new Graph(data, "#bb2577", "График_3");
            graphManager.addGraph(graph1);
            graphManager.addGraph(graph2);

graphManager.addGraph(graph3);
            // Обработчик клика на точку
            canvas.addEventListener("click", (event) => graphManager.handleClick(event));

            // Скрываем подсказку при клике вне точек
            document.addEventListener("click", (event) => {
                if (!canvas.contains(event.target)) {
                    graphManager.tooltip.style.display = "none";
                }
            });

            // Обработчик кнопки
            btn.addEventListener("click", () => {
                const value = parseFloat(inp.value);
                if (!isNaN(value)) {
                    graph1.animateNewPoint(value, graphManager.ctx, () => graphManager.redraw());
                    inp.value = "";
                } else {
                    alert("Please enter a valid number!");
                }
            });
        </script>
    </body>
</html>
