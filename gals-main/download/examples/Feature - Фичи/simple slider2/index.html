<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой слайдер на JavaScript</title>
    <style>
        /* CSS для слайдера */
        .slider {
            max-width: 600px; /* Ширина слайдера */
            height: 400px; /* Высота */
            margin: 0 auto; /* Центрирование */
            position: relative;
            overflow: hidden; /* Скрываем лишнее */
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        .slides {
            display: flex; /* Горизонтальное расположение слайдов */
            transition: transform 0.5s ease; /* Анимация переключения */
        }

        .slide {
            min-width: 100%; /* Каждый слайд занимает всю ширину */
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Масштабирование изображений */
        }

        /* Кнопки */
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .prev { left: 10px; }
        .next { right: 10px; }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <!-- Слайды (замени src на свои изображения) -->
            <div class="slide"><img src="https://source.unsplash.com/random/600x400/?nature" alt="Слайд 1"></div>
            <div class="slide"><img src="https://source.unsplash.com/random/600x400/?city" alt="Слайд 2"></div>
            <div class="slide"><img src="https://source.unsplash.com/random/600x400/?technology" alt="Слайд 3"></div>
            <div class="slide"><img src="https://source.unsplash.com/random/600x400/?animal" alt="Слайд 4"></div>
        </div>
        <!-- Кнопки -->
        <button class="prev">&#10094;</button> <!-- Стрелка влево -->
        <button class="next">&#10095;</button> <!-- Стрелка вправо -->
    </div>

    <script>
        // JavaScript для слайдера
        let currentSlide = 0; // Текущий слайд
        const slides = document.querySelector('.slides'); // Контейнер слайдов
        const totalSlides = slides.children.length; // Количество слайдов
        const slideWidth = 100; // Ширина одного слайда в %

        // Функция показа слайда
        function showSlide(index) {
            if (index >= totalSlides) index = 0; // Если конец, вернуться в начало
            if (index < 0) index = totalSlides - 1; // Если начало, перейти в конец
            slides.style.transform = `translateX(-${index * slideWidth}%)`; // Сдвиг
            currentSlide = index;
        }

        // Кнопка "Назад"
        document.querySelector('.prev').addEventListener('click', () => {
            showSlide(currentSlide - 1);
        });

        // Кнопка "Вперёд"
        document.querySelector('.next').addEventListener('click', () => {
            showSlide(currentSlide + 1);
        });

        // Автоматическое переключение (каждые 3 секунды)
        setInterval(() => {
            showSlide(currentSlide + 1);
        }, 3000); // Изменить время или закомментировать, чтобы отключить

        // Инициализация первого слайда
        showSlide(0);
    </script>
</body>
</html>
