<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица усталости серебра</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        table {
            width: 300px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }
        th {
            background-color: #f8f8f8;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Зависимость предела прочности серебра от количества циклов (от -78 °C до +114 °C)</h2>
    <div class="container">
    <div>
      <span>σ<sub>0</sub> = </span>  <input id="sigma" type="text" value="7" size="2">МПа
      </div>
      <div>
       <span>k = </span> <input id="k" type="text" value="0.0008" size="4">
        </div>
        <button id="btn">add σ<sub>0</sub></button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Количество циклов (N)</th>
                <th>Предел прочности (σ), МПа</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <!-- Данные будут добавлены с помощью JavaScript -->
        </tbody>
    </table>

    <script>
        
        
        // Генерация данных
        
        
     function apdate() {
     
     const cycles = [];
     const strength = [];
     // Параметры модели
            // Начальный предел прочности, МПа
     let sigma0 =+document.getElementById("sigma").value;
     let k =+document.getElementById("k").value;
     // Коэффициент усталости

     
     
        for (let N = 0; N <= 10000; N += 1000) {
            cycles.push(N);
            strength.push(sigma0 * Math.exp(-k * N));
        }

        // Заполнение таблицы данными
        const tableBody = document.getElementById('data-table');
        cycles.forEach((cycle, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${cycle}</td>
                <td>${strength[index].toFixed(3)}</td>
            `;
            tableBody.appendChild(row);
        });
        
     
        }
        
        
      apdate()
    function remove() {
        let rows = document.querySelectorAll("tr");
        rows.forEach((row, i)=>{
        if(i!=0){
            row.remove();
            }
        });
    }
        
    const btn = document.getElementById("btn");
    
    btn.addEventListener("click", function(){
        remove();
        apdate();
    })
        
    </script>
</body>
</html>
