        <script>
            /* translate function*/
            
            const theme = document.getElementById("themeToggle");
    let p = document.querySelector("p"); 
    let span = document.querySelector("span");
    p.innerHTML="Это приложения для подсчёта количества каждой буквы в тексте и вычисления в процентах от количества всех введённых букв. Введите любой текст в поле.";
    let ball = document.querySelector(".ball");
    let btnText = document.querySelector("#btn");
    let togg =  "dark";
    theme.addEventListener("change", ()=>{
        
         
       document.body.classList.toggle(togg);
       if(togg=="dark"){
          
           p.innerHTML="Это приложения для подсчёта количества каждой буквы в тексте и вычисления в процентах от количества всех введённых букв. Введите любой текст в поле.";
           
           span.innerHTML = "ru";
           btnText.innerHTML = "Расчитать кол-во букв";
           togg="dontDark";
           ball.classList.remove("ballEn");
           
       }else{
            p.innerHTML="These are applications for counting the number of each letter in the text of the calculation as a percentage of the number of all entered letters.  Enter any text in the field.";
           btnText.innerHTML = "Count the number of letters"
           span.innerHTML = "en";
           togg="dark";
           ball.classList.add("ballEn");
           
       }
    })
            
        </script>
    </body>
