<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированная прямая</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   
</head>
<body>
    <div class="container">
        <h1>Построение прямой</h1>
        <h3>y = kx + b</h3>
    <hr/>
    <div class="controls">
        <label for="k">Коэффициент k:</label>
        <input type="number" id="k" value="2" step="0.1">
        <br/>
        <label for="b">Коэффициент b:</label>
        <input type="number" id="b" value="3" step="0.1">
        
        <button id="btn" class="btn btn-primary">Построить прямую</button>
    </div>
    
    <canvas id="myCanvas" width="300" height="300"></canvas>
    
    </div>
   </body>
</html>
